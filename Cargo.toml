[package]
name = "agree"
version = "0.0.0"
authors = ["Alexander Weber <aw@voidpointergroup.com>"]
edition = "2021"
license = "MIT"
description = "A multi-key-security CLI tool using Shamir's Secret Sharing."
homepage = "https://github.com/replicadse/agree"
repository = "https://github.com/replicadse/agree"
keywords = ["cli", "secret", "key", "sharing"]
categories = ["command-line-utilities"]
readme = "docs/README.md"

[features]
default = []

[dependencies]
clap = "4.3.21"
clap_complete = "4.3.2"
clap_mangen = "0.2.12"
clap-markdown = "0.1.3"
serde = { version = "1.0.183", features = ["derive"] }
serde_json = "1.0.116"
hocon = { package = "hocon-parser", version = "1.8.0", features = ["serde"] }
anyhow = "1.0.72"
thiserror = "1.0.44"
base64 = "0.21.2"
hmac = "0.12.1"
chacha20poly1305 = "0.10.1"
shamirs = "0.7.0"
dialoguer = "0.10.4"
argon2 = "0.5.1"
uuid = { version = "1.4.1", features = ["v4"] }
sha2 = "0.10.8"
path-clean = "1.0.1"
zeroize = { version = "1.8", features = ["derive"] }
