[package]
name = "agree"
version = "1.0.0"
authors = ["Alexander Weber <aw@voidpointergroup.com>"]
edition = "2021"
license = "MIT"
description = "Split a secret so a threshold of shares can restore it."
homepage = "https://github.com/replicadse/agree"
repository = "https://github.com/replicadse/agree"
keywords = ["cli", "secret", "shamir", "yubikey"]
categories = ["command-line-utilities", "cryptography"]
readme = "docs/README.md"

[features]
default = ["yubikey"]
yubikey = ["dep:yubikey", "dep:aes", "dep:pcsc"]

[dependencies]
aes = { version = "0.8.4", optional = true }
anyhow = "1.0.72"
argon2 = "0.5.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.3.21", features = ["derive"] }
clap-markdown = "0.1.3"
clap_complete = "4.3.2"
clap_mangen = "0.2.12"
libc = "0.2"
path-clean = "1.0.1"
pcsc = { version = "2.9.0", optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10.8"
shamirs = "=0.7.0"
thiserror = "1.0.44"
yubikey = { version = "0.8.0", features = ["untested"], optional = true }
zeroize = { version = "1.8", features = ["derive"] }
