[package]
name = "agree"
version = "1.0.0"
authors = ["Alexander Weber <aw@voidpointergroup.com>"]
edition = "2021"
license = "MIT"
description = "Split a secret so a threshold of shares can restore it."
homepage = "https://github.com/replicadse/agree"
repository = "https://github.com/replicadse/agree"
keywords = ["cli", "secret", "shamir", "yubikey"]
categories = ["command-line-utilities", "cryptography"]
readme = "docs/README.md"

[features]
default = ["yubikey"]
yubikey = ["dep:yubikey", "dep:aes", "dep:pcsc"]

[dependencies]
aes = { version = "0.9.4", optional = true }
anyhow = "1.0.104"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
clap-markdown = "0.1.5"
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
# 1.0.0-alpha is not a release. 0.2 is the current stable line.
libc = "0.2"
path-clean = "1.0.1"
pcsc = { version = "2.9.0", optional = true }
# 0.6 still provides OsRng. 0.10 does not.
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11.1"
# Latest release. Do not bump without a review. See THREAT_MODEL.md T-003.
shamirs = "=0.7.0"
thiserror = "2.0.21"
# Latest stable. 0.9.0-rc.0 is not a release.
yubikey = { version = "0.8.0", features = ["untested"], optional = true }
zeroize = { version = "1.9.1", features = ["derive"] }
