# Reads share passwords from environment variables through trusted shell providers.
# Use with `agree split --trust ...` so these scripts are allowed to run.
threshold = 2

generate = [
  {
    path = "./shares/alice.share"
    encrypt = { shell = "printf '%s' \"$AGREE_ALICE_PASSWORD\"" }
    info = true
  },
  {
    path = "./shares/bob.share"
    encrypt = { shell = "printf '%s' \"$AGREE_BOB_PASSWORD\"" }
    info = true
  },
  {
    path = "./shares/charlie.share"
    info = true
    comment = "Unencrypted recovery share"
  }
]
