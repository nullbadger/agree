# Demonstrates password-protected share payloads.
# Plaintext passwords in blueprints are only suitable for local tests/examples.
threshold = 2

generate = [
  {
    path = "./shares/alice.share"
    encrypt = { plain = "example-alice-password" }
    info = true
  },
  {
    path = "./shares/bob.share"
    encrypt = { plain = "example-bob-password" }
    info = true
  },
  {
    path = "./shares/charlie.share"
    info = true
  }
]
