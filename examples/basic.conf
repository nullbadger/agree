# Splits one secret into three plain shares. Any two shares can restore it.
threshold = 2

generate = [
  {
    path = "./shares/alice.share"
    info = true
  },
  {
    path = "./shares/bob.share"
    info = true
    comment = "Bob keeps this share offline"
  },
  {
    path = "./shares/charlie.share"
    info = true
  }
]
