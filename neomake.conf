version = "0.0"

nodes {
  fmt {
    tasks = [
      {
        script = """
          cargo fmt --all -- --check
        """
      }
    ]
  }

  clippy {
    tasks = [
      {
        script = """
          cargo clippy --all-targets --all-features -- -D warnings
        """
      }
    ]
  }

  build {
    matrix {
      parallel = false
      dimensions = [
        [
          { env = { vars = {} } },
          { env = { vars = { RELEASE = "--release" } } }
        ]
      ]
    }
    tasks = [
      {
        script = """
          set -e
          cargo build $RELEASE
        """
      }
    ]
  }

  test {
    tasks = [
      {
        script = """
          cargo test --no-fail-fast
        """
      }
    ]
  }

  doc {
    tasks = [
      {
        script = """
          cargo doc --no-deps
        """
      }
    ]
  }

  check {
    pre = [
      { name = "fmt" },
      { name = "clippy" },
      { name = "build" },
      { name = "test" },
      { name = "doc" }
    ]
    tasks = []
  }
}
